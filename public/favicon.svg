<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Chimney -->
    <rect x="42" y="14" width="7" height="15" rx="1.5" fill="#94a3b8" stroke="#64748b" stroke-width="0.8"/>
    
    <!-- House body -->
    <rect x="14" y="27" width="36" height="28" rx="3" fill="url(#wallGrad)" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Roof with overhang -->
    <polygon points="32,8 6,29 11,33 32,16 53,33 58,29" fill="url(#roofGrad)" stroke="#c2410c" stroke-width="0.8"/>
    
    <!-- Door -->
    <path d="M34 55 V39 A 2 2 0 0 1 36 37 H42 A 2 2 0 0 1 44 39 V55 Z" fill="#2563eb"/>
    <circle cx="42" cy="47" r="1.2" fill="#ffffff"/>

    <!-- Window -->
    <rect x="20" y="36" width="10" height="10" rx="2" fill="#fbbf24" stroke="#d97706" stroke-width="0.8"/>
    <rect x="21" y="37" width="3.6" height="3.6" rx="0.5" fill="#fef08a"/>
    <rect x="25.4" y="37" width="3.6" height="3.6" rx="0.5" fill="#fef08a"/>
    <rect x="21" y="41.4" width="3.6" height="3.6" rx="0.5" fill="#fef08a"/>
    <rect x="25.4" y="41.4" width="3.6" height="3.6" rx="0.5" fill="#fef08a"/>
  </g>
</svg>