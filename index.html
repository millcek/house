<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Návrh Domu na Pozemku (40x27 m)</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0, 0, 0, 0.8);
        padding: 12px 18px;
        border-radius: 8px;
        pointer-events: none;
        font-size: 14px;
        z-index: 10;
        line-height: 1.4;
      }
      #fileInput {
        display: none;
      }
    </style>

    <!-- Načtení Three.js, OrbitControls a dat.GUI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
  </head>
  <body>
    <div id="info">
      <strong>Ovládání pohledu:</strong><br />
      • Levá myš: Otáčení scény<br />
      • Pravá myš: Posun pohledu<br />
      • Kolečko: Přiblížení / Oddálení<br /><br />
      <strong>Pozemek:</strong> 40 × 27 metrů<br />
      <em>1 čtverec mřížky = 1 × 1 metr</em>
    </div>

    <!-- Skrytý input pro nahrávání JSON souboru -->
    <input type="file" id="fileInput" accept=".json" />

    <script>
      // Rozměry pozemku
      const PLOT_WIDTH = 27; // X rozměr
      const PLOT_DEPTH = 40; // Z rozměr
      const ROAD_WIDTH = 4; // Šířka cesty v metrech

      // 1. Nastavení scény, kamery a rendereru
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x90b0d0);
      scene.fog = new THREE.Fog(0x90b0d0, 40, 140);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        1,
        1000,
      );
      camera.position.set(0, 30, 40);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Ovládání kamery myší
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.update();

      // 2. Osvětlení
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
      dirLight.position.set(25, 40, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 150;
      const d = 30;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      // 3. Pozemek (40x27 metrů)
      const groundGeometry = new THREE.PlaneGeometry(PLOT_WIDTH, PLOT_DEPTH);
      const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0x55aa55,
        roughness: 0.8,
      });
      const ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Mřížka pozemku (1 čtverec = 1 m)
      const grid = new THREE.GridHelper(
        PLOT_DEPTH,
        PLOT_DEPTH,
        0x000000,
        0x336633,
      );
      grid.position.y = 0.01;
      scene.add(grid);

      // 3b. Cesta na pravé (+X) a spodní/přední (+Z) straně pozemku
      const roadMaterial = new THREE.MeshStandardMaterial({
        color: 0x333333,
        roughness: 0.9,
      });
      const stripeMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

      // Pravá cesta (podél hloubky Z)
      const rightRoadGeo = new THREE.PlaneGeometry(
        ROAD_WIDTH,
        PLOT_DEPTH + ROAD_WIDTH,
      );
      const rightRoad = new THREE.Mesh(rightRoadGeo, roadMaterial);
      rightRoad.rotation.x = -Math.PI / 2;
      rightRoad.position.set(
        PLOT_WIDTH / 2 + ROAD_WIDTH / 2,
        -0.01,
        ROAD_WIDTH / 2,
      );
      rightRoad.receiveShadow = true;
      scene.add(rightRoad);

      // Spodní/přední cesta (podél šířky X)
      const bottomRoadGeo = new THREE.PlaneGeometry(
        PLOT_WIDTH + ROAD_WIDTH,
        ROAD_WIDTH,
      );
      const bottomRoad = new THREE.Mesh(bottomRoadGeo, roadMaterial);
      bottomRoad.rotation.x = -Math.PI / 2;
      bottomRoad.position.set(
        -ROAD_WIDTH / 2,
        -0.01,
        PLOT_DEPTH / 2 + ROAD_WIDTH / 2,
      );
      bottomRoad.receiveShadow = true;
      scene.add(bottomRoad);

      // Křižovatka vpravo dole
      const cornerRoadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_WIDTH);
      const cornerRoad = new THREE.Mesh(cornerRoadGeo, roadMaterial);
      cornerRoad.rotation.x = -Math.PI / 2;
      cornerRoad.position.set(
        PLOT_WIDTH / 2 + ROAD_WIDTH / 2,
        -0.01,
        PLOT_DEPTH / 2 + ROAD_WIDTH / 2,
      );
      cornerRoad.receiveShadow = true;
      scene.add(cornerRoad);

      // Ukládání objektů
      const objectsData = [];
      let objectCounter = 0;

      // 4. Geometrie střechy (trojúhelníkový hranol)
      function createPrismGeometry(width, height, depth) {
        const geometry = new THREE.BufferGeometry();
        const w = width / 2;
        const h = height;
        const d = depth / 2;

        const vertices = new Float32Array([
          // Přední a zadní čelo
          -w,
          0,
          d,
          w,
          0,
          d,
          0,
          h,
          d,
          w,
          0,
          -d,
          -w,
          0,
          -d,
          0,
          h,
          -d,

          // Levá střešní strana
          -w,
          0,
          d,
          0,
          h,
          d,
          -w,
          0,
          -d,
          -w,
          0,
          -d,
          0,
          h,
          d,
          0,
          h,
          -d,

          // Pravá střešní strana
          w,
          0,
          d,
          w,
          0,
          -d,
          0,
          h,
          d,
          0,
          h,
          d,
          w,
          0,
          -d,
          0,
          h,
          -d,

          // Spodní základna
          -w,
          0,
          d,
          -w,
          0,
          -d,
          w,
          0,
          d,
          w,
          0,
          d,
          -w,
          0,
          -d,
          w,
          0,
          -d,
        ]);

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(vertices, 3),
        );
        geometry.computeVertexNormals();
        return geometry;
      }

      // 5. GUI Rozhraní (dat.GUI)
      const gui = new dat.GUI({ width: 320 });
      const objectsFolder = gui.addFolder("Objekty ve scéně");
      objectsFolder.open();

      function createCustomObject(
        type,
        w,
        h,
        d,
        color,
        namePrefix,
        initialPos = null,
        initialRotY = 0,
      ) {
        let geometry;
        if (type === "box") {
          geometry = new THREE.BoxGeometry(w, h, d);
        } else {
          geometry = createPrismGeometry(w, h, d);
        }

        const material = new THREE.MeshStandardMaterial({
          color: color,
          roughness: 0.5,
        });
        const mesh = new THREE.Mesh(geometry, material);

        mesh.castShadow = true;
        mesh.receiveShadow = true;

        // Výchozí pozice
        if (initialPos) {
          mesh.position.set(initialPos.x, initialPos.y, initialPos.z);
        } else if (type === "box") {
          mesh.position.set(0, h / 2, 0);
        } else {
          mesh.position.set(0, 3, 0);
        }

        mesh.rotation.y = THREE.MathUtils.degToRad(initialRotY);

        scene.add(mesh);
        objectCounter++;

        const id = objectCounter;
        const folder = objectsFolder.addFolder(`${namePrefix} #${id}`);

        const params = {
          type: type,
          color: color,
          namePrefix: namePrefix,
          width: w,
          height: h,
          depth: d,
          rotY: initialRotY,
        };

        const objRecord = {
          id: id,
          mesh: mesh,
          params: params,
          folder: folder,
        };

        objectsData.push(objRecord);

        function updateGeometry() {
          mesh.geometry.dispose();
          if (type === "box") {
            mesh.geometry = new THREE.BoxGeometry(
              params.width,
              params.height,
              params.depth,
            );
          } else {
            mesh.geometry = createPrismGeometry(
              params.width,
              params.height,
              params.depth,
            );
          }
          autoSaveToLocalStorage();
        }

        // GUI - Rozměry
        const dimFolder = folder.addFolder("Rozměry (v metrech)");
        dimFolder
          .add(params, "width", 0.5, 30, 0.5)
          .name("Šířka X (m)")
          .onChange(updateGeometry);
        dimFolder
          .add(params, "height", 0.5, 20, 0.5)
          .name("Výška Y (m)")
          .onChange(updateGeometry);
        dimFolder
          .add(params, "depth", 0.5, 30, 0.5)
          .name("Hloubka Z (m)")
          .onChange(updateGeometry);
        dimFolder.open();

        // GUI - Pozice (hranice nastavené podle rozsahu 40x27 m pozemku)
        const posFolder = folder.addFolder("Pozice (m)");
        posFolder
          .add(mesh.position, "x", -PLOT_WIDTH / 2, PLOT_WIDTH / 2, 0.5)
          .name("Pozice X")
          .onChange(autoSaveToLocalStorage);
        posFolder
          .add(mesh.position, "y", 0, 20, 0.25)
          .name("Pozice Y (Výška)")
          .onChange(autoSaveToLocalStorage);
        posFolder
          .add(mesh.position, "z", -PLOT_DEPTH / 2, PLOT_DEPTH / 2, 0.5)
          .name("Pozice Z")
          .onChange(autoSaveToLocalStorage);

        // GUI - Rotace
        const rotFolder = folder.addFolder("Rotace");
        rotFolder
          .add(params, "rotY", 0, 360, 15)
          .name("Otočení (°)")
          .onChange((v) => {
            mesh.rotation.y = THREE.MathUtils.degToRad(v);
            autoSaveToLocalStorage();
          });

        // Smazání objektu
        const removeObj = {
          remove: function () {
            deleteObject(objRecord);
            autoSaveToLocalStorage();
          },
        };
        folder.add(removeObj, "remove").name("❌ Smazat objekt");
        folder.open();

        autoSaveToLocalStorage();
      }

      function deleteObject(objRecord) {
        scene.remove(objRecord.mesh);
        objRecord.mesh.geometry.dispose();
        objRecord.mesh.material.dispose();
        objectsFolder.removeFolder(objRecord.folder);
        const index = objectsData.indexOf(objRecord);
        if (index > -1) objectsData.splice(index, 1);
      }

      function clearAllObjects() {
        while (objectsData.length > 0) {
          deleteObject(objectsData[0]);
        }
        objectCounter = 0;
      }

      // --- EXPORT & IMPORT & LOCALSTORAGE LOGIKA ---
      function exportDataJSON() {
        const dataToExport = objectsData.map((item) => ({
          type: item.params.type,
          namePrefix: item.params.namePrefix,
          color: item.params.color,
          width: item.params.width,
          height: item.params.height,
          depth: item.params.depth,
          position: {
            x: item.mesh.position.x,
            y: item.mesh.position.y,
            z: item.mesh.position.z,
          },
          rotY: item.params.rotY,
        }));
        return JSON.stringify(dataToExport, null, 2);
      }

      function importDataFromJSON(jsonString) {
        try {
          const data = JSON.parse(jsonString);
          if (!Array.isArray(data)) return false;

          clearAllObjects();
          data.forEach((item) => {
            createCustomObject(
              item.type,
              item.width,
              item.height,
              item.depth,
              item.color,
              item.namePrefix,
              item.position,
              item.rotY,
            );
          });
          return true;
        } catch (e) {
          console.error("Chyba při načítání JSONu:", e);
          return false;
        }
      }

      function autoSaveToLocalStorage() {
        const json = exportDataJSON();
        localStorage.setItem("3d_house_scene_40x27", json);
      }

      // --- GUI MENU - AKCE A SOUBORY ---
      const actions = {
        addHouse: function () {
          createCustomObject("box", 8, 3, 10, 0xffffff, "Dům (Kvádr)");
        },
        addRoof: function () {
          createCustomObject("prism", 8.2, 2.5, 10.2, 0x222222, "Střecha");
        },
        saveLocal: function () {
          autoSaveToLocalStorage();
          alert("Scéna byla úspěšně uložena do LocalStorage!");
        },
        loadLocal: function () {
          const saved = localStorage.getItem("3d_house_scene_40x27");
          if (saved) {
            if (importDataFromJSON(saved)) {
              alert("Scéna byla načtena z LocalStorage!");
            } else {
              alert("Chyba při načítání dat.");
            }
          } else {
            alert("V LocalStorage není uložena žádná scéna.");
          }
        },
        downloadJSON: function () {
          const json = exportDataJSON();
          const blob = new Blob([json], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "navrh-domu-40x27.json";
          a.click();
          URL.revokeObjectURL(url);
        },
        uploadJSON: function () {
          document.getElementById("fileInput").click();
        },
        clearScene: function () {
          if (confirm("Opravdu chcete vymazat celou scénu?")) {
            clearAllObjects();
            autoSaveToLocalStorage();
          }
        },
      };

      const addFolder = gui.addFolder("Přidat objekt");
      addFolder.add(actions, "addHouse").name("+ Přidat Dům");
      addFolder.add(actions, "addRoof").name("+ Přidat Střechu");
      addFolder.open();

      const storageFolder = gui.addFolder("Ukládání & Export");
      storageFolder.add(actions, "saveLocal").name("💾 Uložit do prohlížeče");
      storageFolder.add(actions, "loadLocal").name("📂 Načíst z prohlížeče");
      storageFolder.add(actions, "downloadJSON").name("⬇ Export do JSON");
      storageFolder.add(actions, "uploadJSON").name("⬆ Import z JSON");
      storageFolder.add(actions, "clearScene").name("🗑 Vyčistit scénu");
      storageFolder.open();

      // Handler pro nahrání souboru
      document
        .getElementById("fileInput")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function (evt) {
            if (importDataFromJSON(evt.target.result)) {
              alert("Scéna byla úspěšně načtena ze souboru!");
            } else {
              alert("Chyba: Soubor neobsahuje platný formát scény.");
            }
          };
          reader.readAsText(file);
          e.target.value = "";
        });

      // --- INICIALIZACE SCÉNY ---
      const savedScene = localStorage.getItem("3d_house_scene_40x27");
      if (savedScene && savedScene !== "[]") {
        importDataFromJSON(savedScene);
      } else {
        actions.addHouse();
        actions.addRoof();
      }

      // Resizing okna
      window.addEventListener("resize", onWindowResize, false);
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      // Renderovací smyčka
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
